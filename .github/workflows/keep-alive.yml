
name: VoltLedger Backend Keep Alive

on:
  schedule:
    - cron: "*/5 * * * *"

  # Allows you to test it manually from GitHub
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: voltledger-keepalive
  cancel-in-progress: false

jobs:
  ping-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ping Render backend
        env:
          BACKEND_URL: https://voltledger-api.onrender.com/api/health
        run: python keep_alive.py
