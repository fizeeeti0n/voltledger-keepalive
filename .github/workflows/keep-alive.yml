
name: VoltLedger Backend Keep Alive

on:
  schedule:
    - cron: "*/4 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: voltledger-keepalive
  cancel-in-progress: false

jobs:
  ping-backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Ping Render backend
        env:
          BACKEND_URL: https://voltledger-api.onrender.com/api/health
        run: python keep_alive.py
